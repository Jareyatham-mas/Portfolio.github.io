<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132c25" />
    <meta
      name="description"
      content="จริยธรรม มาสงค์ — นักศึกษาวิทยาการคอมพิวเตอร์ สนใจ Full-Stack Development, Backend และ Software Testing"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const t = localStorage.getItem("rainforest-theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        const l = localStorage.getItem("rainforest-locale");
        if (l === "en") document.documentElement.lang = l;
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <title>จริยธรรม มาสงค์ — Developer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
